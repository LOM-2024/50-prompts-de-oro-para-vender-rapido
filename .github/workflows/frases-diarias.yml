name: Actualizar frases del día

on:
  schedule:
    - cron: '0 7 * * *'   # Todos los días a las 07:00 UTC
  workflow_dispatch:      # Para probarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  actualizar-frases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar 30 frases al azar
        run: |
          python3 - << 'EOF'
          import random
          from datetime import datetime

          # Leer las 100 frases
          with open("frases.txt", "r", encoding="utf-8") as f:
              frases = [line.strip() for line in f if line.strip()]

          # Elegir 30 al azar
          seleccion = random.sample(frases, 30)

          fecha = datetime.utcnow().strftime("%Y-%m-%d")

          # Generar el bloque markdown
          bloque = f"### {fecha}\n\n"
          for i, frase in enumerate(seleccion, 1):
              bloque += f"{i}. {frase}\n"
          bloque += "\n"

          # Leer README actual
          with open("README.md", "r", encoding="utf-8") as f:
              contenido = f.read()

          # Reemplazar la sección diaria
          inicio = "<!-- DAILY_START -->"
          fin = "<!-- DAILY_END -->"
          nuevo_contenido = contenido.split(inicio)[0] + inicio + "\n" + bloque + fin + contenido.split(fin)[1]

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(nuevo_contenido)

          print("30 frases actualizadas correctamente")
          EOF

      - name: Commit y push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: actualizar 30 frases del día"
          file_pattern: README.md
