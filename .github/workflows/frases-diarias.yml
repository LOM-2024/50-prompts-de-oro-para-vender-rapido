name: Actualizar frases del día

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-frases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generar 30 frases al azar
        run: |
          python3 - << 'EOF'
          import random
          from datetime import datetime

          with open("frases.txt", "r", encoding="utf-8") as f:
              frases = [line.strip() for line in f if line.strip()]

          seleccion = random.sample(frases, 30)
          fecha = datetime.utcnow().strftime("%Y-%m-%d")

          bloque = f"### {fecha}\n\n"
          for i, frase in enumerate(seleccion, 1):
              bloque += f"{i}. {frase}\n"
          bloque += "\n"

          with open("README.md", "r", encoding="utf-8") as f:
              contenido = f.read()

          inicio = "<!-- DAILY_START -->"
          fin = "<!-- DAILY_END -->"

          if inicio not in contenido or fin not in contenido:
              raise Exception("No se encontraron los marcadores DAILY_START / DAILY_END en el README")

          nuevo_contenido = contenido.split(inicio)[0] + inicio + "\n" + bloque + fin + contenido.split(fin)[1]

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(nuevo_contenido)

          print("30 frases actualizadas correctamente")
          EOF

      - name: Commit y push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "docs: actualizar 30 frases del día"
            git pull --rebase origin main
            git push
          fi
